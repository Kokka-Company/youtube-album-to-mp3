name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile ytmp3.py gui.py mechenformat.py
      - name: CLI smoke test
        run: |
          python ytmp3.py --help
          python mechenformat.py --help
